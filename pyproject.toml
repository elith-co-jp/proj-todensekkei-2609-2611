[project]
name = "seq-annotator"
version = "1.0.0"
description = "シーケンス図のシンボル(bbox)と配線(from-to)を登録し、YOLO 形式で出力するアノテーションツール"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "analysis/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# BLE001: 広い except は「UI/起動を止めない」意図の箇所に限定して使う（コード内コメント併記）
extend-select = ["B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 慣例: Depends/File/Query をデフォルト値で使う
"routers/*.py" = ["B008"]
# テストで import 前に環境変数を差し替える
"tests/conftest.py" = ["E402"]
# 凍結 exe 用ランチャ: 例外を潰す意図的なパターンがある
"desktop.py" = ["S110", "SIM115"]

[tool.coverage.run]
# 製品として動くコード（API・サービス・解析の実行部分）を数える。CI は pytest --cov で 100% を求める（DD-0045）。
source = ["."]
omit = [
    "tests/*",
    "analysis/tests/*",
    # 研究用の道具（評価・データ作り・調査の画面）。製品の EXE には入らない
    "analysis/tools/*",
    "analysis/ui/*",
    "analysis/synthetic_circuits/*",
    "scripts/*",
    ".venv/*",
    "frontend/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
