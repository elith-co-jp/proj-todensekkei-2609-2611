name: CI

# PR と main への push ごとに、バックエンドのテスト・ruff と、画面の型検査・テストを回す。
# EXE のビルド（build-windows-exe.yml）とは別。版は constraints.txt で固定する。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests and ruff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install uv==0.13.7
          uv pip install --system -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest

      # 合成回路・合成図面での評価（DD-0038）。基準値（analysis/eval_baseline.json）より悪くなれば失敗する
      - name: Evaluation (quick)
        run: python analysis/tools/eval_suite.py --quick --out runs/eval

      - name: Upload evaluation summary
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: eval-summary
          path: runs/eval/summary.*
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Tests
        run: npm test
