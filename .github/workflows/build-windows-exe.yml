name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the verified executable to GitHub Artifacts and Google Drive
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build one-file Windows executable
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify source tree has no confidential artifacts
        run: |
          $ErrorActionPreference = "Stop"
          $forbiddenPatterns = @(
            "*.pdf",
            "*.tif",
            "*.tiff",
            "*.db",
            "*.sqlite",
            "*.sqlite3",
            "*.zip",
            "*.7z",
            "*.rar",
            "*.doc",
            "*.docx",
            "*.xls",
            "*.xlsx",
            "*.ppt",
            "*.pptx"
          )
          $excludedDirs = @(
            "\\.git\\",
            "\\.venv\\",
            "\\build\\",
            "\\dist\\",
            "\\frontend\\dist\\",
            "\\frontend\\node_modules\\"
          )

          $forbiddenSourceFiles = Get-ChildItem -Path . -Recurse -File -Force |
            Where-Object {
              $fullName = $_.FullName
              $fileName = $_.Name
              $isExcluded = $false
              foreach ($dir in $excludedDirs) {
                if ($fullName -match $dir) {
                  $isExcluded = $true
                  break
                }
              }

              $isForbidden = $false
              foreach ($pattern in $forbiddenPatterns) {
                if ($fileName -like $pattern) {
                  $isForbidden = $true
                  break
                }
              }

              $isForbidden -and -not $isExcluded
            }

          if ($forbiddenSourceFiles) {
            $forbiddenSourceFiles | ForEach-Object { Write-Error "Forbidden source file: $($_.FullName)" }
            throw "Confidential-looking source artifacts are present. Remove them before building the exe."
          }

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-ml.txt "pyinstaller>=6.17,<7"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Fetch verified training base model
        run: python scripts/fetch_base_model.py

      - name: Build executable
        run: |
          pyinstaller seq-annotator.spec --noconfirm --clean

      - name: Verify packaged output
        run: |
          $ErrorActionPreference = "Stop"
          $exePath = "dist\TodenYOLO.exe"
          if (-not (Test-Path $exePath -PathType Leaf)) {
            throw "Expected artifact was not created: $exePath"
          }

          $unexpectedEntries = Get-ChildItem -Path dist -Force |
            Where-Object { $_.Name -ne "TodenYOLO.exe" }
          if ($unexpectedEntries) {
            $unexpectedEntries | ForEach-Object { Write-Error "Unexpected dist entry: $($_.FullName)" }
            throw "dist must contain only TodenYOLO.exe. Refusing to upload a folder-style build or data files."
          }

          $forbiddenPatterns = @(
            "*.pdf",
            "*.tif",
            "*.tiff",
            "*.png",
            "*.jpg",
            "*.jpeg",
            "*.bmp",
            "*.db",
            "*.sqlite",
            "*.sqlite3",
            "*.zip",
            "*.7z",
            "*.rar",
            "*.doc",
            "*.docx",
            "*.xls",
            "*.xlsx",
            "*.ppt",
            "*.pptx"
          )
          $forbiddenDistFiles = Get-ChildItem -Path dist -Recurse -File -Force |
            Where-Object {
              $fileName = $_.Name
              $isForbidden = $false
              foreach ($pattern in $forbiddenPatterns) {
                if ($fileName -like $pattern) {
                  $isForbidden = $true
                  break
                }
              }

              $isForbidden -and $fileName -ne "TodenYOLO.exe"
            }
          if ($forbiddenDistFiles) {
            $forbiddenDistFiles | ForEach-Object { Write-Error "Forbidden dist file: $($_.FullName)" }
            throw "Refusing to upload dist because it contains confidential-looking files."
          }

      - name: Smoke test frozen training and inference
        timeout-minutes: 15
        run: python scripts/smoke_packaged_ml.py dist/TodenYOLO.exe

      - name: Upload executable
        if: github.event_name == 'push' || inputs.publish
        uses: actions/upload-artifact@v7.0.1
        with:
          name: TodenYOLO-windows-exe
          path: dist/TodenYOLO.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Google Drive
        if: github.event_name == 'push' || inputs.publish
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: 1RXQF7syvhMOmS86IB3bhJZOxgFnlKqZq
          SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
          PYTHONIOENCODING: utf-8
        run: |
          if (-not $env:GOOGLE_DRIVE_CREDENTIALS_JSON) {
            throw "GOOGLE_DRIVE_CREDENTIALS_JSON が未設定です。README の「Google Drive への自動アップロード」を参照してください。"
          }
          pip install google-api-python-client==2.200.0
          python scripts/upload_to_drive.py dist/TodenYOLO.exe
